[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-money-saver"
version = "0.1.0"
description = "麦门省钱助手 — McDonald's China MCP coupon/points money-saving skill"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0,<1.0.0",
]

[project.scripts]
mcd-money-saver = "mcd_money_saver.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
